<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard | T11 Learning Hub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <nav class="col-md-3 col-lg-2 d-md-block sidebar collapse">
                <h4 class="py-3 text-primary">Student Portal</h4>
                <ul class="nav flex-column">
                    <li class="nav-item"><a class="nav-link active" href="#"><i class="fas fa-home"></i> Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="#"><i class="fas fa-book"></i> My Courses</a></li>
                    <li class="nav-item"><a class="nav-link" href="#"><i class="fas fa-certificate"></i> Certificates</a></li>
                    <li class="nav-item"><a class="nav-link" href="#"><i class="fas fa-tasks"></i> Assignments</a></li>
                    <li class="nav-item mt-5"><a class="nav-link text-danger" href="index.html">Logout</a></li>
                </ul>
            </nav>

            <!-- Main Content -->
            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
                <h2>Welcome Back, Student!</h2>
                <div class="row mt-4">
                    <div class="col-md-4">
                        <div class="card p-3 bg-primary text-white">
                            <h6>Course Progress</h6>
                            <h3>75%</h3>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="card p-3 bg-success text-white">
                            <h6>Assignments Completed</h6>
                            <h3>12/15</h3>
                        </div>
                    </div>
                </div>

                <h4 class="mt-5">My Courses</h4>
                <div class="table-responsive">
                    <table class="table align-middle">
                        <thead>
                            <tr>
                                <th>Course Name</th>
                                <th>Progress</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>Frontend Development</td>
                                <td>
                                    <div class="progress">
                                        <div class="progress-bar bg-info" role="progressbar" aria-valuenow="80" style="width: 0%;"></div>
                                    </div>
                                </td>
                                <td><span class="badge bg-warning">In Progress</span></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </main>
        </div>
    </div>
    <script src="js/script.js"></script>
</body>
</html>
