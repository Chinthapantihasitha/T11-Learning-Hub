<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login | T11 Learning Hub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        body { background-color: #f4f7f6; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-card { width: 100%; max-width: 400px; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="card shadow-lg p-4 border-0">
            <div class="text-center mb-4">
                <h3 class="fw-bold text-primary">Student Login</h3>
                <p class="text-muted">Welcome back to T11 Hub</p>
            </div>
            <form action="dashboard.html">
                <div class="mb-3">
                    <label class="form-label">Email Address</label>
                    <input type="email" class="form-control" placeholder="name@example.com" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" class="form-control" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2">Login</button>
            </form>
            <div class="text-center mt-3">
                <p class="small">Don't have an account? <a href="register.html">Register Here</a></p>
                <a href="index.html" class="text-decoration-none small">← Back to Home</a>
            </div>
        </div>
    </div>
</body>
</html>
